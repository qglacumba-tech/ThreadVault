# XAMPP Apache virtual host for the ThreadVault workspace.
# Enable mod_proxy and mod_proxy_http in C:\xampp\apache\conf\httpd.conf.
# Include this file from C:\xampp\apache\conf\extra\httpd-vhosts.conf.
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "C:/path/to/ThreadVault/static"

    <Directory "C:/path/to/ThreadVault/static">
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    Alias "/assets/" "C:/path/to/ThreadVault/assets/"
    <Directory "C:/path/to/ThreadVault/assets">
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass "/api/" "http://127.0.0.1:5000/api/"
    ProxyPassReverse "/api/" "http://127.0.0.1:5000/api/"
    ProxyPass "/seller" "http://127.0.0.1:5000/seller"
    ProxyPassReverse "/seller" "http://127.0.0.1:5000/seller"
    ProxyPass "/account" "http://127.0.0.1:5000/account"
    ProxyPassReverse "/account" "http://127.0.0.1:5000/account"
</VirtualHost>
